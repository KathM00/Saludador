<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Saludador</title>
  </head>
  <body>
    <h1>Bot Saludador</h1>
    <form id="saludar-form">
      <label for="nombre-input">Nombre:</label>
      <input type="text" id="nombre-input" />
      
      <label for="edad-input">Edad:</label>
      <input type="number" id="edad-input" />

      <label for="genero-select">Género:</label>
      <select id="genero-select">
        <option value="M">Masculino</option>
        <option value="F">Femenino</option>
      </select>

      <button type="submit">Saludar</button>
    </form>
    <div id="resultado-div"></div>
    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
